spring.application.name=ViaVeneto
# 8081 para no chocar con la peluquería cuando corren las dos en la misma compu
server.port=${PORT:8081}

# Desarrollo: base H2 en un archivo local, no hace falta instalar MySQL
spring.datasource.url=jdbc:h2:file:./data/viaveneto;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Carga mesas y una carta de ejemplo si la base está vacía
viaveneto.datos-iniciales=${VIAVENETO_DATOS_INICIALES:true}
